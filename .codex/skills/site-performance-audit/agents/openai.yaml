interface:
  display_name: "Site Performance Audit"
  short_description: "Audit site performance with Chrome DevTools"
  default_prompt: "Use $site-performance-audit to audit mobile performance for the supplied URL or representative pages."

dependencies:
  tools:
    - type: "mcp"
      value: "chrome-devtools"
      description: "Chrome DevTools MCP server for performance traces and page diagnostics"
      transport: "stdio"
